<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Linear</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{ --bg-gradient: linear-gradient(45deg, #ff3b3b, #ffd24d); --accent: #ff0000; }
    html,body{height:100%;}
    body { margin:0; padding:20px; font-family:'Press Start 2P', cursive; background:var(--bg-gradient); color:#fff; text-align:center; }
    h1 { font-size:28px; text-transform:uppercase; letter-spacing:3px; text-shadow:3px 3px 0px #000,6px 6px 0px #ff0000; margin:10px 0; }
    button { font-family:'Press Start 2P', cursive; background:#111; color:#fff; border:3px solid var(--accent); padding:8px 12px; margin:6px; cursor:pointer; text-transform:uppercase; letter-spacing:2px; box-shadow:3px 3px 0px #000; }
    button:hover { background:var(--accent); color:#000; box-shadow:3px 3px 0px #000; transform:translate(-2px,-2px); }
    button:active { transform:translate(2px,2px); box-shadow:none; }
    .slot { background:#222; border:3px solid #fff; padding:10px; margin:10px 0; box-shadow:3px 3px 0px #000; color:#fff; text-align:center; }
    #itemSlots,#petSlots,#boostShop { background: rgba(0,0,0,0.6); padding:15px; border:3px solid #fff; margin:20px auto; box-shadow:5px 5px 0px #000; max-width:900px; }
    #notifications { position:fixed; top:20px; right:20px; z-index:999; max-width:320px; text-align:right; }
    .notification { background:#000; color:#fff; border:3px solid var(--accent); padding:8px; margin-top:10px; box-shadow:3px 3px 0px var(--accent); animation: popup 0.15s ease; }
    @keyframes popup { from{transform:scale(0.7);opacity:0;} to{transform:scale(1);opacity:1;} }
    #adminArea { display:none; margin:20px auto; background:#000; padding:10px; border:3px solid #fff; max-width:900px; }
    .timer { margin-bottom:10px; font-size:12px; color:#fff; }
    ul { list-style:none; padding-left:0; max-width:900px; margin:0 auto; text-align:left; }
    li { padding:4px 8px; }
    .muted { opacity:0.85; font-size:12px; }
    @media (max-width:600px){ body{padding:10px;} h1{font-size:18px;} }
  </style>
</head>
<body>
  <h1>Linear</h1>
  <div class="infoRow">Money: $<span id="money">0</span></div>
  <div class="infoRow">Income/sec: <span id="income">0</span></div>
  <div class="infoRow">Boost: <span id="boostStatus">None</span></div>
  <div class="infoRow">Tick Speed: <span id="tickIntervalDisplay">1.0s</span> (<span id="tickBoostStatus">Normal</span>)</div>

  <div style="max-width:900px;margin:10px auto;">
    <button id="playMusicBtn" aria-controls="spotifyPlayer">Press Me and Then Press Play</button>
    <div style="margin-top:10px;">
      <iframe id="spotifyPlayer" title="Spotify player" style="border-radius:12px; display:none;" src="https://open.spotify.com/embed/track/5Cw6SX4MtdaOvM0GbN5g7j?utm_source=generator" width="100%" height="80" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
  </div>

  <div id="boostShop">
    <h2>Boost Shop</h2>
    <button id="buyBoost">Buy 2x Income Boost ($1000)</button>
    <button id="buyTickBoost">Buy Tick Boost ($1,000,000+)</button>
  </div>

  <div style="max-width:900px;margin:0 auto;">
    <button id="openAdmin">Admin</button>
    <button id="saveBtn">Save</button>
    <button id="loadBtn">Load</button>
    <button id="reportBug">Report a Bug</button>
    <div id="lastSaved" class="muted"></div>
  </div>

  <h2>Shop - Items</h2>
  <div class="timer">Refresh in <span id="itemTimer">120</span>s</div>
  <div id="itemSlots"></div>

  <h2>Shop - Pets</h2>
  <div class="timer">Refresh in <span id="petTimer">120</span>s</div>
  <div id="petSlots"></div>

  <h2>Owned Items</h2>
  <ul id="itemsList"></ul>
  <h2>Owned Pets</h2>
  <ul id="petsList"></ul>

  <div id="adminArea" aria-hidden="true">
    <h3>Admin Panel</h3>
    <input id="adminCmdInput" placeholder="Enter command" aria-label="admin command">
    <button id="runAdmin">Run</button>
    <p class="muted">Commands: <code>giveMoney &lt;amount&gt;</code>, <code>forceItem &lt;rarity&gt;</code>, <code>forceEgg &lt;rarity&gt;</code></p>
  </div>

  <div id="notifications" role="status" aria-live="polite"></div>

<script>
// Clean, working JS. Keeps the Easter egg rarity but removes the broken/truncated fragments that caused syntax errors.
let money = 10; let autoIncome = 0; let multiplier = 1;
let tickInterval = 1000, tickBoostCost = 1000000, boostActiveUntil = null;
let shopCountdown = 120, petShopCountdown = 120;

const itemNames = ['Sword','Shield','Helmet','Armor','Boots','Amulet','Ring'];
const rarities = [
  { name: 'Common',    bonus: 1,     cost: 10,       color: 'white',   chance: 40 },
  { name: 'Uncommon',  bonus: 5,     cost: 100,      color: 'lime',    chance: 20 },
  { name: 'Rare',      bonus: 15,    cost: 1000,     color: 'aqua',    chance: 15 },
  { name: 'Epic',      bonus: 25,    cost: 10000,    color: 'violet',  chance: 10 },
  { name: 'Legendary', bonus: 50,    cost: 50000,    color: 'orange',  chance: 5 },
  { name: 'Mythic',    bonus: 100,   cost: 75000,    color: 'magenta', chance: 3 },
  { name: 'Insane',    bonus: 300,   cost: 100000,   color: 'red',     chance: 1 },
  { name: 'Godly',     bonus: 500,   cost: 500000,   color: 'gold',    chance: 0.4 },
  { name: 'Crazy',     bonus: 1000,  cost: 1000000,  color: 'cyan',    chance: 0.09 },
  { name: 'If you see this tell Henry Dale', bonus: 1000000000, cost: 1, color: 'magenta', chance: 0.01 }
];

let itemsOwned = [], petsOwned = [], currentItemSlots = [], currentPetSlots = [];

const moneyEl = document.getElementById('money'), incomeEl = document.getElementById('income');
const boostStatusEl = document.getElementById('boostStatus'), tickBoostStatusEl = document.getElementById('tickBoostStatus');
const tickIntervalDisplayEl = document.getElementById('tickIntervalDisplay');
const itemSlotsEl = document.getElementById('itemSlots'), petSlotsEl = document.getElementById('petSlots');
const itemsListEl = document.getElementById('itemsList'), petsListEl = document.getElementById('petsList');
const itemTimerEl = document.getElementById('itemTimer'), petTimerEl = document.getElementById('petTimer');
const notificationsEl = document.getElementById('notifications');

function showNotification(text, ms = 3000){ if(!notificationsEl) return; const note = document.createElement('div'); note.className = 'notification'; note.textContent = text; notificationsEl.appendChild(note); setTimeout(()=>note.remove(), ms); }

function formatNumber(n){ if(typeof n!=='number') return n; if(!isFinite(n)) return n.toString(); return Math.floor(n).toLocaleString(); }

function getRandomRarity(){ const total = rarities.reduce((s,r)=>s + (r.chance||0),0); const roll = Math.random()*total; let sum=0; for(const r of rarities){ sum += (r.chance||0); if(roll <= sum) return r; } return rarities[0]; }

function fillItemSlots(){ currentItemSlots = []; for(let i=0;i<4;i++){ const r = getRandomRarity(); const name = itemNames[Math.floor(Math.random()*itemNames.length)]; currentItemSlots.push({name,rarityName:r.name,bonus:r.bonus,cost:r.cost,color:r.color,bought:false}); } }
function fillPetSlots(){ currentPetSlots = []; for(let i=0;i<3;i++){ const r = getRandomRarity(); currentPetSlots.push({rarityName:r.name,bonus:r.bonus,cost:r.cost,color:r.color,bought:false}); } }

function renderShops(){ itemSlotsEl.innerHTML = ''; petSlotsEl.innerHTML = '';
  currentItemSlots.forEach(slot=>{
    const div = document.createElement('div'); div.className = 'slot';
    div.innerHTML = `<b style="color:${slot.color}">${slot.rarityName} ${slot.name}</b> (+${slot.bonus}/sec) - $${formatNumber(slot.cost)}`;
    const btn = document.createElement('button'); btn.textContent = slot.bought ? 'Bought' : 'Buy'; btn.disabled = slot.bought;
    btn.onclick = ()=>{ if(slot.bought) return; if(money < slot.cost) return alert('Cannot buy: insufficient funds'); money -= slot.cost; autoIncome += slot.bonus; slot.bought = true; itemsOwned.push({name:slot.name,rarityName:slot.rarityName,bonus:slot.bonus,color:slot.color}); renderItemsOwned(); showNotification(`Bought ${slot.rarityName} ${slot.name}`); updateDisplay(); renderShops(); };
    div.appendChild(btn); itemSlotsEl.appendChild(div);
  });

  currentPetSlots.forEach(slot=>{
    const div = document.createElement('div'); div.className = 'slot';
    div.innerHTML = `<b style="color:${slot.color}">${slot.rarityName} Egg</b> - $${formatNumber(slot.cost)}`;
    const btn = document.createElement('button'); btn.textContent = slot.bought ? 'Hatched' : 'Hatch'; btn.disabled = slot.bought;
    btn.onclick = ()=>{ if(slot.bought) return; if(money < slot.cost) return alert('Cannot hatch: insufficient funds'); money -= slot.cost; const r = rarities.find(rr => rr.name === slot.rarityName) || rarities[0]; const pet = { rarityName: r.name, bonus: r.bonus, color: r.color }; petsOwned.push(pet); autoIncome += pet.bonus; slot.bought = true; renderPetsOwned(); showNotification(`Hatched a ${pet.rarityName} Pet (+${pet.bonus}/sec)`); updateDisplay(); renderShops(); };
    div.appendChild(btn); petSlotsEl.appendChild(div);
  });
}

function renderItemsOwned(){ itemsListEl.innerHTML = ''; itemsOwned.forEach(it=>{ const li = document.createElement('li'); li.textContent = `${it.name} (${it.rarityName}) +${it.bonus}/sec`; li.style.color = it.color || 'white'; itemsListEl.appendChild(li); }); }
function renderPetsOwned(){ petsListEl.innerHTML = ''; petsOwned.forEach(p=>{ const li = document.createElement('li'); li.textContent = `${p.rarityName} Pet (+${p.bonus}/sec)`; li.style.color = p.color || 'white'; petsListEl.appendChild(li); }); }

let lastTick = Date.now(); function tick(){ const now = Date.now(); if(now - lastTick >= tickInterval){ money += autoIncome * multiplier; lastTick = now; updateDisplay(); } } setInterval(tick,50);

function updateDisplay(){ if(moneyEl) moneyEl.textContent = formatNumber(money); if(incomeEl) incomeEl.textContent = formatNumber(autoIncome * multiplier); if(tickIntervalDisplayEl) tickIntervalDisplayEl.textContent = (tickInterval/1000).toFixed(2) + 's'; if(tickBoostStatusEl) tickBoostStatusEl.textContent = tickInterval < 1000 ? 'Fast' : 'Normal'; if(boostStatusEl) boostStatusEl.textContent = (boostActiveUntil && Date.now() < boostActiveUntil) ? 'Active' : 'None'; }

let boostCooldown = 0, boostTimer = 0;
function updateBoostButtonsText(){ const buyBoostBtn = document.getElementById('buyBoost'); const buyTickBtn = document.getElementById('buyTickBoost'); if(buyBoostBtn) buyBoostBtn.textContent = `Buy 2x Income Boost ($1000)${boostCooldown>0 ? ' - cooldown: '+boostCooldown+'s' : ''}`; if(buyTickBtn) buyTickBtn.textContent = `Buy Tick Boost ($${formatNumber(tickBoostCost)})`; }
setInterval(()=>{ if(boostCooldown>0) boostCooldown--; if(boostTimer>0) boostTimer--; updateBoostButtonsText(); },1000);

document.getElementById('buyBoost').onclick = ()=>{ if(boostCooldown>0) return alert('Boost on cooldown'); if(money<1000) return alert('Insufficient funds'); money-=1000; multiplier*=2; boostActiveUntil = Date.now() + 5*60*1000; boostCooldown = 15*60; boostTimer = 5*60; showNotification('2x Income Boost activated for 5 minutes!'); updateDisplay(); };
document.getElementById('buyTickBoost').onclick = ()=>{ if(money < tickBoostCost) return alert('Not enough money'); money -= tickBoostCost; tickBoostCost += 1000000; tickInterval = Math.max(100, tickInterval - 100); showNotification('Tick speed boosted!'); updateDisplay(); updateBoostButtonsText(); };

document.getElementById('openAdmin').onclick = ()=>{ const code = prompt('Enter admin password:'); if(code === 'UnlikeMe123#'){ const adminArea = document.getElementById('adminArea'); if(adminArea) adminArea.style.display = 'block'; } else alert('Wrong password'); };

document.getElementById('runAdmin').onclick = ()=>{ const input = document.getElementById('adminCmdInput'); if(!input) return alert('No admin input element found'); const parts = input.value.trim().split(/\s+/); if(!parts.length) return alert('Enter a command'); const cmd = parts[0].toLowerCase(); if(cmd==='givemoney'||cmd==='addmoney'){ const amt = parseInt(parts[1],10); if(isNaN(amt)) return alert('Invalid amount'); money += amt; showNotification(`Added $${formatNumber(amt)}`); updateDisplay(); } else if(cmd==='forceitem'){ const rarityName = parts[1]; if(!rarityName) return alert('Specify rarity name'); const r = rarities.find(x=>x.name.toLowerCase()===rarityName.toLowerCase()); if(!r) return alert('Invalid rarity'); const name = itemNames[Math.floor(Math.random()*itemNames.length)]; itemsOwned.push({name,rarityName:r.name,bonus:r.bonus,color:r.color}); autoIncome += r.bonus; renderItemsOwned(); showNotification(`Forced give: ${r.name} ${name}`); updateDisplay(); } else if(cmd==='forceegg'){ const rarityName = parts[1]; if(!rarityName) return alert('Specify rarity name'); const r = rarities.find(x=>x.name.toLowerCase()===rarityName.toLowerCase()); if(!r) return alert('Invalid rarity'); petsOwned.push({rarityName:r.name,bonus:r.bonus,color:r.color}); autoIncome += r.bonus; renderPetsOwned(); showNotification(`Forced egg hatched: ${r.name} Pet`); updateDisplay(); } else alert('Unknown command'); };

document.getElementById('reportBug').onclick = ()=>{ const msg = prompt('Describe the bug:'); if(!msg) return; const email = 'henrydale2813@student.lvusd.org'; const subject = encodeURIComponent('Bug Report: Linear'); const body = encodeURIComponent(msg + '\n\n---\nUser agent: ' + navigator.userAgent); window.location.href = `mailto:${email}?subject=${subject}&body=${body}`; showNotification('Opened mail client to report bug'); };

function saveGame(){ const data = { money, autoIncome, multiplier, tickInterval, itemsOwned, petsOwned, currentItemSlots, currentPetSlots, boostActiveUntil }; localStorage.setItem('linear_save', JSON.stringify(data)); const lastSavedEl = document.getElementById('lastSaved'); if(lastSavedEl) lastSavedEl.textContent = 'Saved at ' + new Date().toLocaleTimeString(); showNotification('Game saved'); }
function loadGame(){ const raw = localStorage.getItem('linear_save'); if(!raw) return alert('No save found'); try{ const data = JSON.parse(raw); money = Number(data.money) || money; autoIncome = Number(data.autoIncome) || autoIncome; multiplier = Number(data.multiplier) || multiplier; tickInterval = Number(data.tickInterval) || tickInterval; itemsOwned = data.itemsOwned || []; petsOwned = data.petsOwned || []; currentItemSlots = data.currentItemSlots || []; currentPetSlots = data.currentPetSlots || []; boostActiveUntil = data.boostActiveUntil || null; renderItemsOwned(); renderPetsOwned(); renderShops(); updateDisplay(); showNotification('Game loaded'); }catch(e){ alert('Failed to load save: ' + e.message); } }

document.getElementById('saveBtn').onclick = saveGame; document.getElementById('loadBtn').onclick = loadGame;

document.getElementById('playMusicBtn').onclick = ()=>{ const player = document.getElementById('spotifyPlayer'); if(player) player.style.display = 'block'; showNotification('Scroll down and press Play in Spotify player!'); };

setInterval(()=>{ shopCountdown--; petShopCountdown--; if(itemTimerEl) itemTimerEl.textContent = Math.max(0, shopCountdown); if(petTimerEl) petTimerEl.textContent = Math.max(0, petShopCountdown); if(shopCountdown<=0){ shopCountdown=120; fillItemSlots(); renderShops(); } if(petShopCountdown<=0){ petShopCountdown=120; fillPetSlots(); renderShops(); } },1000);

fillItemSlots(); fillPetSlots(); renderShops(); renderItemsOwned(); renderPetsOwned(); updateDisplay(); updateBoostButtonsText();
</script>
<script src="js/game.js"></script>
</body>
</html>
